syntax = "proto3";
package driver;

import "common.proto";
import "executor.proto";

service DriverService {
  rpc RouteIdentify (ImageQuery) returns (IdentifyResult);
  rpc RouteVerify (VerifyImagePair) returns (VerifyResult);
  rpc RegisterFace (RegisterRequest) returns (RegisterResponse);
  rpc GetUserId (NameOriginQuery) returns (UserIdResult);
  rpc DeleteFace (DeleteRequest) returns (DeleteResponse);
}

message ImageQuery {
  bytes image_data = 1;
}

message IdentifyResult {
  string message = 1;
  repeated executor.FaceResult results = 2;
}

message VerifyImagePair {
  bytes image1 = 1;
  bytes image2 = 2;
}

message VerifyResult {
  float similarity = 1;
  string result = 2;
}

message RegisterRequest {
  bytes image_data = 1;
  string user_id = 2;
  string name = 3;
  string origin = 4;
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message NameOriginQuery {
  string name = 1;
  string origin = 2;
}

message UserIdResult {
  string user_id = 1;
}

message DeleteRequest {
  string user_id = 1;
}

message DeleteResponse {
  string message = 1;
}